name: pgTAP

# 資料庫護欄(P2-08):RLS/RPC/Guard Trigger 是安全邊界,全套 pgTAP 必須在
# 每個 PR 與 main 上自動執行。原本只在動到 migrations/tests/config 時觸發,
# 但 2026-09-06 健檢把 pgtap 列為 main ruleset 的必要 status check——
# 路徑過濾會讓沒動 DB 的 PR 永遠拿不到這個 check 而無法合併(E-10),
# 且前端改 RPC 呼叫參數也不會觸發 DB 測試。改為一律執行(約 3–5 分鐘)。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # 與本機跑法同一套(docs/REAL_BACKEND_E2E.md 的 staging 章節、
      # colima 最小服務組):起本機 stack → db reset 套全部 migrations →
      # 容器內 psql 逐檔執行。排除的服務 pgTAP 用不到;未知服務名 CLI 只警告。
      - name: 啟動本機 Supabase(最小服務組)
        run: supabase start -x analytics,vector,edge-runtime,imgproxy,inbucket,realtime,storage,studio
      - name: 從零套用全部 migrations
        run: supabase db reset
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 執行全套 pgTAP
        run: npm run test:db
