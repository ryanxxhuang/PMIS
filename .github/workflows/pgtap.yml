name: pgTAP

# 資料庫護欄(P2-08):RLS/RPC/Guard Trigger 是安全邊界,全套 pgTAP 必須在
# 每個 PR 與 main 上自動執行。原本只在動到 migrations/tests/config 時觸發,
# 但 2026-09-06 健檢把 pgtap 列為 main ruleset 的必要 status check——
# 路徑過濾會讓沒動 DB 的 PR 永遠拿不到這個 check 而無法合併(E-10),
# 且前端改 RPC 呼叫參數也不會觸發 DB 測試。改為一律執行(約 3–5 分鐘)。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # 與本機同一條路徑(scripts/test-pgtap.js):runner 自己用 `supabase db start`
      # 起一個一次性資料庫(獨立 project_id),從零套全部 migrations 與 seed,
      # 容器內 psql 逐檔執行,跑完即刪。不再另外 `supabase start`／`db reset`。
      - name: 執行全套 pgTAP(一次性資料庫從零套用)
        run: npm run test:db
