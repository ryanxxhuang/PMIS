<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 主題 bootstrap 必須擺在任何樣式表之前且維持同步(不加 defer/async):
         它要在首繪前把 .dark 掛上 <html>,晚一步就是深色使用者每次載入都閃白。
         判定邏輯與 src/lib/theme.js 綁在一起,改任一邊都要看 public/theme-boot.js 的說明。 -->
    <script src="/theme-boot.js"></script>
    <title>PMIS｜公共工程專案管理</title>
    <meta name="description" content="台灣公共工程專案管理：標單估驗、施工日誌、品質工安、契約與協作，由 PMIS 協助整理與追蹤。" />
    <meta property="og:title" content="PMIS｜公共工程專案管理" />
    <meta property="og:description" content="標單估驗、施工日誌、三級品管、契約義務追蹤,AI 少輸入多產出。" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- 字型 self-host(機關禁外連 CDN):main.jsx 以 JS import 載入
         @fontsource-variable/noto-sans-tc 與 src/assets 的 Material Symbols subset,零外連。
         圖示字型的 preload link 由 vite.config.js 的 pmis-preload-icon-font 於 build 期注入
         (檔名帶 content hash 不能寫死),所以這裡看不到是正常的;原因見該外掛註解。 -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
