<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>契約重點 · 履約時程（設計參考）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
  :root{
    --text:#202124; --text2:#3c4043; --ground:#f8fafd; --card:#fff; --line:#e3e6ea; --divider:#dadce0;
    --accent:#0b57d0; --a100:#ecf3fe; --a700:#0842a0; --a800:#062e6f;
    --n200:#f1f3f4; --n300:#e8eaed; --n500:#bdc1c6; --n600:#80868b; --n700:#5f6368;
    --ok:#146c2e; --okT:#0f5223; --okB:#e6f4ea; --okBar:#81c995;
    --warn:#a05a00; --warnT:#8a4b00; --warnB:#fef7e0;
    --danger:#b3261e; --dangerT:#8c1d18; --dangerB:#fceeec;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);
    font-family:"Google Sans Text","Noto Sans TC",system-ui,sans-serif;font-size:13px;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1360px;margin:0 auto;padding:28px 24px 56px}
  h1{margin:0;font-size:26px;font-weight:400;letter-spacing:-.005em}
  .sub{margin:6px 0 0;font-size:13px;line-height:1.7;color:var(--n700);max-width:740px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--a700);text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::selection{background:#d3e3fd}
  .msy{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;
    letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  .msy-f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}

  .pillgroup{display:flex;padding:2px;border:1px solid var(--divider);border-radius:100px;background:#fff}
  .pillgroup button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border:0;
    border-radius:100px;background:transparent;color:var(--text2);font-family:inherit;font-size:12px;
    font-weight:500;cursor:pointer}
  .pillgroup button:hover{filter:brightness(.97)}
  .pillgroup button[aria-pressed="true"]{background:var(--accent);color:#fff}

  .exec{display:flex;align-items:stretch;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .exec>div{flex:1;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .selftag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:100px;
    background:var(--a100);color:var(--a700);font-size:10px;font-weight:500}
  .bar{display:flex;height:6px;border-radius:100px;overflow:hidden;background:var(--n300);margin-bottom:10px}

  .phases{display:flex;align-items:stretch;gap:2px}
  .phases button{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding:9px 11px 10px;
    border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;color:var(--text);
    text-align:left;cursor:pointer}
  .phases button:hover{filter:brightness(.975)}
  .phases button[aria-pressed="true"]{border-color:var(--accent);background:var(--a100)}
  .today{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:100px;
    background:var(--accent);color:#fff;font-size:10px;font-weight:500}

  .search{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border:1px solid var(--divider);
    border-radius:100px;background:#fff}
  .search:focus-within{border-color:var(--accent)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:13px;color:var(--text)}
  .chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:100px;
    border:1px solid var(--divider);background:#fff;color:var(--text2);font-family:inherit;font-size:12px;
    font-weight:500;cursor:pointer}
  .chip:hover{filter:brightness(.97)}
  .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--a100);color:var(--a700)}
  .dot{width:7px;height:7px;border-radius:100px;flex:none}
  .sel{height:30px;padding:0 8px;border:1px solid var(--divider);border-radius:8px;background:#fff;
    font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer}
  .txtbtn{height:30px;padding:0 10px;border:0;border-radius:100px;background:transparent;color:var(--accent);
    font-family:inherit;font-size:12px;font-weight:500;cursor:pointer}
  .txtbtn:hover{background:var(--a100)}

  .ghead{display:flex;align-items:center;gap:12px;padding:13px 18px 11px;background:var(--ground);
    border-bottom:1px solid var(--line)}
  .row{display:grid;grid-template-columns:104px 26px minmax(0,1fr) 96px;gap:12px;align-items:stretch;
    width:100%;padding:0;border:0;border-bottom:1px solid var(--line);background:#fff;font-family:inherit;
    color:var(--text);text-align:left;cursor:pointer}
  .row:hover{filter:brightness(.975)}
  .row[aria-current="true"]{background:var(--a100)}
  .spine{position:relative;display:flex;justify-content:center}
  .spine i{width:2px;background:var(--n300)}
  .spine b{position:absolute;top:14px;width:11px;height:11px;border-radius:100px;background:#fff;
    border-width:2.5px;border-style:solid;box-sizing:border-box}
  .whopill{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:100px;
    border:1px solid var(--divider);background:#fff;color:var(--text2);font-size:10.5px;font-weight:500;white-space:nowrap}
  .whopill.self{border-color:var(--accent);background:var(--a100);color:var(--a700)}
  .kind{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;
    border:1px solid var(--divider);background:#fff;color:var(--n700);font-size:10px;font-weight:500;white-space:nowrap}
  .stat{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;
    font-weight:500;white-space:nowrap}

  .btn{display:inline-flex;align-items:center;gap:6px;height:36px;border-radius:100px;font-family:inherit;
    font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid transparent}
  .btn-primary{padding:0 16px;background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--a700)}
  .btn-primary:active{background:var(--a800)}
  .btn-sec{padding:0 14px;background:#fff;border-color:var(--divider);color:var(--text2)}
  .btn-sec:hover{background:var(--n200)}
  .btn-ghost{padding:0 12px;background:transparent;color:var(--n700)}
  .btn-ghost:hover{background:var(--n200)}

  .grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
  aside{position:sticky;top:24px}
  @media (max-width:1199px){ .exec>div{min-width:calc(50% - 6px)} }
  @media (max-width:1023px){ .grid{grid-template-columns:minmax(0,1fr)} aside{position:static} }
  @media (max-width:767px){
    .row{grid-template-columns:minmax(0,1fr);gap:4px;padding:12px 18px}
    .row>span{padding:0!important}
    .spine{display:none}
    .phases{overflow-x:auto}
    .phases button{min-width:160px}
    .btn{height:44px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:20px;flex-wrap:wrap">
    <div style="min-width:0">
      <h1>契約重點 · 履約時程</h1>
      <p class="sub" id="blurb"></p>
    </div>
    <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:11.5px;color:var(--n700)">檢視身分</span>
        <div class="pillgroup" id="roles"></div>
      </div>
      <span style="font-size:10.5px;color:var(--n600)">示範用切換 · 實際依登入身分自動套用</span>
    </div>
  </div>

  <div class="exec" id="exec"></div>

  <div class="card" style="padding:15px 18px 17px;margin-bottom:24px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:13px">
      <span style="font-size:13px;font-weight:500">履約期程</span>
      <span class="num" style="font-size:11px;color:var(--n700)">開工 2026-03-01 · 完工 2027-05-30 · 保固期滿 2032-08-30 · 可見 <span id="poolN"></span> 條</span>
    </div>
    <div class="phases" id="phases"></div>
  </div>

  <div class="grid">
    <section class="card" style="min-width:0">
      <div style="padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px">
        <label class="search">
          <span class="msy" style="font-size:20px;color:var(--n700)">search</span>
          <input id="q" type="search" placeholder="搜尋條文、關鍵字、條款編號或頁碼…" aria-label="搜尋契約義務">
        </label>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
          <span style="width:1px;height:20px;background:var(--line);margin:0 2px"></span>
          <select id="who" class="sel" aria-label="責任方"></select>
          <select id="type" class="sel" aria-label="類型"></select>
          <button type="button" class="txtbtn" id="reset" hidden>清除篩選</button>
        </div>
      </div>
      <div id="rows" role="list"></div>
      <div style="padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px">
        <span class="num" style="font-size:11.5px;color:var(--n700)">顯示 <span id="shown"></span> / <span id="poolN2"></span> 條 · 來源 4 份文件 · AI 最近整理 2026-08-20 14:12</span>
        <a href="#" style="font-size:11.5px">重新整理擷取結果</a>
      </div>
    </section>
    <aside class="card" id="detail" aria-live="polite"></aside>
  </div>
</div>

const state = { role:'機關', q:'', status:'all', type:'全部類型', who:'全部責任方', phase:'all', selectedId:'c1' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);

const pool = () => DATA.filter(r => VISIBLE[state.role].includes(r.who));

function dayDiff(d){ return (!d || d === '—') ? null : Math.round((new Date(d+'T00:00:00') - TODAY)/86400000); }
function dLabel(r){
  if (r.status === 'na') return '未觸發';
  if (r.status === 'done') return '已完成';
  const n = dayDiff(r.date);
  if (n === null) return '';
  if (n < 0) return `逾期 ${-n} 日`;
  if (n === 0) return '今天到期';
  if (n < 60) return `還有 ${n} 日`;
  if (n < 730) return `還有 ${Math.round(n/30)} 個月`;
  return `還有 ${(n/365).toFixed(1)} 年`;
}
function dFg(r){ return r.status==='overdue' ? 'var(--dangerT)' : r.status==='due' ? 'var(--warnT)' : 'var(--n700)'; }

function matches(r){
  if (state.status !== 'all' && r.status !== state.status) return false;
  if (state.phase !== 'all' && r.phase !== state.phase) return false;
  if (state.type !== '全部類型' && r.type !== state.type) return false;
  if (state.who !== '全部責任方' && r.who !== state.who) return false;
  const n = state.q.trim().toLowerCase();
  if (!n) return true;
  return [r.title,r.desc,r.clause,r.page,r.quote,r.type,r.who,r.kind,r.calc].join(' ').toLowerCase().includes(n);
}
const whoPill = who => `<span class="whopill${who===state.role?' self':''}"><span class="msy" style="font-size:13px">${PARTY[who].icon}</span>${esc(who)}</span>`;

function renderRoles(){
  $('#roles').innerHTML = ['廠商','監造','機關'].map(k =>
    `<button type="button" data-role="${k}" aria-pressed="${state.role===k}"><span class="msy" style="font-size:16px">${PARTY[k].icon}</span>${k}</button>`).join('');
  $('#blurb').textContent = BLURB[state.role];
}

function renderExec(){
  $('#exec').innerHTML = VISIBLE[state.role].map(name => {
    const own = DATA.filter(r => r.who === name);
    const n = k => own.filter(r => r.status === k).length;
    const done=n('done'), overdue=n('overdue'), due=n('due'), sched=n('scheduled');
    const settled = done + overdue;
    const pct = settled ? Math.round(done/settled*100) : null;
    const rateFg = pct===null ? 'var(--n700)' : pct===100 ? 'var(--okT)' : pct>=80 ? 'var(--text)' : 'var(--dangerT)';
    const seg = (v,c) => v ? `<span style="width:${v/own.length*100}%;background:${c}"></span>` : '';
    const na = n('na');
    const stats = [['逾期',overdue,'var(--danger)'],['即將到期',due,'var(--warn)'],['排程中',sched,'var(--accent)'],['已完成',done,'var(--ok)']];
    if (na) stats.push(['無需處理',na,'var(--n500)']);
    return `<div style="border-left:3px solid ${PARTY[name].mark}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:11px">
        <span class="msy" style="font-size:18px;color:var(--n700)">${PARTY[name].icon}</span>
        <span style="font-size:13px;font-weight:500">${name}</span>
        ${name===state.role?'<span class="selftag">自己</span>':''}
        <span class="num" style="margin-left:auto;font-size:11px;color:var(--n700)">${own.length} 條義務</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:11px">
        <span class="num" style="font-size:27px;font-weight:400;line-height:1;color:${rateFg}">${pct===null?'—':pct+'%'}</span>
        <span style="font-size:11.5px;color:var(--n700);line-height:1.5">${pct===null?'尚無到期項目':`到期 ${settled} 項準時完成 ${done} 項`}</span>
      </div>
      <div class="bar">${seg(done,'var(--ok)')}${seg(overdue,'var(--danger)')}${seg(due,'var(--warn)')}</div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        ${stats.map(([l,v,c]) => `<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--n700)">
          <span class="dot" style="background:${c}"></span>${l}<span class="num" style="font-weight:500;color:var(--text)">${v}</span></span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function phaseStats(key){
  const all = pool().filter(r => r.phase === key);
  const bad = all.filter(r=>r.status==='overdue').length;
  const soon = all.filter(r=>r.status==='due').length;
  const done = all.filter(r=>r.status==='done').length;
  const note = !all.length ? '無義務'
    : bad ? `${all.length} 項 · ${bad} 項逾期`
    : soon ? `${all.length} 項 · ${soon} 項即將到期`
    : done===all.length ? `${all.length} 項 · 全部完成`
    : `${all.length} 項 · 排程中`;
  const noteFg = bad ? 'var(--dangerT)' : soon ? 'var(--warnT)' : 'var(--n700)';
  const track = !all.length ? 'var(--n200)' : bad ? 'var(--danger)' : done===all.length ? 'var(--okBar)'
    : key===NOW_PHASE ? 'var(--accent)' : 'var(--n300)';
  return { note, noteFg, track, total: all.length };
}

function renderPhases(){
  $('#phases').innerHTML = PHASES.map(p => {
    const s = phaseStats(p.key);
    return `<button type="button" data-phase="${p.key}" aria-pressed="${state.phase===p.key}">
      <span style="display:flex;align-items:center;gap:7px;min-height:17px">
        <span style="font-size:12.5px;font-weight:500">${p.name}</span>
        ${p.key===NOW_PHASE?'<span class="today num">今天</span>':''}
      </span>
      <span class="num" style="font-size:10.5px;color:var(--n700);line-height:1.5">${p.range}</span>
      <span style="height:6px;border-radius:100px;background:${s.track}"></span>
      <span class="num" style="font-size:10.5px;color:${s.noteFg};line-height:1.5">${s.note}</span>
    </button>`;
  }).join('');
}

function renderChips(){
  const p = pool();
  const c = k => p.filter(r => r.status === k).length;
  $('#chips').innerHTML = [['overdue','已逾期'],['due','即將到期'],['scheduled','排程中'],['done','已完成'],['na','無需處理']]
    .map(([k,label]) => `<button type="button" class="chip" data-status="${k}" aria-pressed="${state.status===k}">
      <span class="dot" style="background:${ST[k].dot}"></span>${label}<span class="num" style="opacity:.75">${c(k)}</span></button>`).join('');
}

function renderSelects(){
  const p = pool();
  const multi = VISIBLE[state.role].length > 1;
  $('#who').hidden = !multi;
  if (multi) $('#who').innerHTML = ['全部責任方', ...VISIBLE[state.role]]
    .map(o => `<option${o===state.who?' selected':''}>${esc(o)}</option>`).join('');
  $('#type').innerHTML = ['全部類型', ...new Set(p.map(r=>r.type))]
    .map(o => `<option${o===state.type?' selected':''}>${esc(o)}</option>`).join('');
  $('#reset').hidden = !(state.status!=='all' || state.phase!=='all' || state.type!=='全部類型' || state.who!=='全部責任方' || state.q.trim());
}

function renderRows(){
  const p = pool();
  const visible = p.filter(matches);
  $('#shown').textContent = visible.length;
  $('#poolN').textContent = $('#poolN2').textContent = p.length;

  if (!visible.length){
    $('#rows').innerHTML = `<div style="padding:48px 18px;text-align:center;color:var(--n700);font-size:12.5px;line-height:1.8">
      沒有符合條件的義務。<br>試試條款編號（例 5.3）、頁碼，或關鍵字（例 保固、罰則、送審）。</div>`;
    return;
  }
  $('#rows').innerHTML = PHASES.map(ph => {
    const items = visible.filter(r => r.phase === ph.key);
    if (!items.length) return '';
    const s = phaseStats(ph.key);
    return `<div>
      <div class="ghead">
        <span style="font-size:12.5px;font-weight:500;white-space:nowrap">${ph.name}</span>
        <span class="num" style="font-size:11px;color:var(--n700);white-space:nowrap">${ph.range}</span>
        <span style="flex:1;height:1px;background:var(--n300)"></span>
        <span class="num" style="font-size:11px;color:var(--n700);white-space:nowrap">${s.note}</span>
      </div>
      ${items.map(r => `<button type="button" class="row" role="listitem" data-id="${r.id}" aria-current="${r.id===state.selectedId}">
        <span style="padding:12px 0 12px 18px;display:flex;flex-direction:column;gap:3px">
          <span class="num" style="font-size:12px;font-weight:500">${esc(r.date)}</span>
          <span class="num" style="font-size:10.5px;color:${dFg(r)};line-height:1.5">${dLabel(r)}</span>
        </span>
        <span class="spine"><i></i><b style="border-color:${ST[r.status].dot}"></b></span>
        <span style="padding:12px 0;min-width:0;display:flex;flex-direction:column;gap:4px">
          <span style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            ${whoPill(r.who)}${r.kind?`<span class="kind">${esc(r.kind)}</span>`:''}
          </span>
          <span style="font-size:13px;font-weight:500;line-height:1.5;text-wrap:pretty">${esc(r.title)}</span>
          <span class="num" style="font-size:11.5px;color:var(--n700);line-height:1.6">${esc(`${r.clause} · ${r.page} · ${r.type}`)}</span>
        </span>
        <span style="padding:12px 18px 12px 0;display:flex;justify-content:flex-end;align-items:flex-start">
          <span class="stat" style="background:${ST[r.status].bg};color:${ST[r.status].fg}">${ST[r.status].label}</span>
        </span>
      </button>`).join('')}
    </div>`;
  }).join('');
}

function renderDetail(){
  const p = pool();
  const r = p.find(x => x.id === state.selectedId) || p[0];
  const st = ST[r.status];
  const isMine = r.who === state.role;
  const meta = [['責任方',r.who],['階段',(PHASES.find(x=>x.key===r.phase)||{}).name],
    ['到期日', r.date==='—' ? '依條件觸發' : `${r.date}（${dLabel(r)}）`],
    ['頻率', r.kind || '單次'],['允收標準',r.criteria],['應留存',r.evidence]];

  let actions;
  if (isMine && ['overdue','due','scheduled'].includes(r.status))
    actions = `<button type="button" class="btn btn-primary"><span class="msy msy-f" style="font-size:17px">task_alt</span>標記完成</button>
      <button type="button" class="btn btn-sec"><span class="msy" style="font-size:17px">upload_file</span>上傳文件</button>`;
  else if (isMine && r.status === 'done')
    actions = `<button type="button" class="btn btn-sec"><span class="msy" style="font-size:17px">undo</span>取消完成</button>`;
  else if (isMine)
    actions = `<span style="flex:1;min-width:180px;font-size:11.5px;color:var(--n700);line-height:1.65">罰則條款，非待辦事項。完工逾期時自動轉為待處理。</span>`;
  else
    actions = `<span style="flex:1;min-width:180px;font-size:11.5px;color:var(--n700);line-height:1.65">由${esc(r.who)}負責執行，本頁為唯讀檢視。</span>`;

  $('#detail').innerHTML = `
    <div style="padding:13px 16px;border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="stat" style="background:${st.bg};color:${st.fg}">${st.label}</span>
      ${whoPill(r.who)}
      <a href="#" title="在原文件中開啟" style="margin-left:auto;font-size:11.5px">開啟原文</a>
    </div>
    <div style="padding:16px">
      <div style="font-size:15px;font-weight:500;line-height:1.5;text-wrap:pretty">${esc(r.title)}</div>
      <p style="margin:8px 0 0;font-size:12.5px;line-height:1.8;color:var(--text2)">${esc(r.desc)}</p>
      <div style="margin-top:14px;display:grid;grid-template-columns:70px minmax(0,1fr);gap:7px 12px;font-size:12px;line-height:1.6">
        ${meta.map(([k,v]) => `<span style="color:var(--n700)">${esc(k)}</span><span class="num">${esc(v)}</span>`).join('')}
      </div>
    </div>
    <div style="padding:0 16px 16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="msy" style="font-size:15px;color:var(--n700)">history</span>
        <span style="font-size:12.5px;font-weight:500">執行紀錄</span>
      </div>
      ${(r.log||[]).map(e => `<div style="display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:start">
        <span style="position:relative;display:flex;justify-content:center;align-self:stretch;min-height:26px">
          <span style="width:2px;background:var(--n300)"></span>
          <span style="position:absolute;top:5px;width:7px;height:7px;border-radius:100px;background:${ST[e.s].dot}"></span>
        </span>
        <span style="padding-bottom:9px;display:flex;flex-direction:column;gap:1px">
          <span class="num" style="font-size:11px;color:var(--n700);line-height:1.5">${esc(e.when)}</span>
          <span style="font-size:12px;line-height:1.6">${esc(e.what)}</span>
        </span></div>`).join('')}
    </div>
    <div style="padding:0 16px 16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="msy" style="font-size:15px;color:var(--n700)">description</span>
        <span style="font-size:12.5px;font-weight:500">AI 擷取依據</span>
        <span class="stat" style="height:20px;padding:0 7px;font-size:10.5px;background:${r.verified?'var(--okB)':'var(--warnB)'};color:${r.verified?'var(--okT)':'var(--warnT)'}">${r.verified?'來源已核對':'來源待核對'}</span>
      </div>
      <div style="background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:11px 12px">
        <div class="num" style="font-size:11px;color:var(--n700);line-height:1.6">${esc(`${r.doc} · ${r.clause} · ${r.page}`)}</div>
        <blockquote style="margin:7px 0 0;font-size:12px;line-height:1.85">「${esc(r.quote)}」</blockquote>
      </div>
      <div style="margin-top:8px;display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--n700);line-height:1.65">
        <span class="msy" style="font-size:15px;flex:none;margin-top:1px">function</span>
        <span>到期日推算：${esc(r.calc)}</span>
      </div>
    </div>
    <div style="padding:0 16px 16px">
      <div style="font-size:12.5px;font-weight:500;margin-bottom:8px">關聯</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${r.links.map(l => `<a href="#" style="display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:8px">
          <span class="msy" style="font-size:15px;color:var(--n700)">${l.icon}</span>
          <span style="flex:1;min-width:0;font-size:12px;color:var(--text2)">${esc(l.text)}</span>
          <span class="msy" style="font-size:16px;color:var(--n600)">chevron_right</span></a>`).join('')}
      </div>
    </div>
    <div style="padding:12px 16px;border-top:1px solid var(--divider);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      ${actions}
      <button type="button" class="btn btn-ghost" style="margin-left:auto">擷取有誤</button>
    </div>`;
}

function pickDefault(){
  const p = pool();
  const first = p.find(r=>r.status==='overdue') || p.find(r=>r.status==='due') || p[0];
  state.selectedId = first.id;
}

function render(){ renderRoles(); renderExec(); renderPhases(); renderChips(); renderSelects(); renderRows(); renderDetail(); }
function renderList(){ renderPhases(); renderChips(); renderSelects(); renderRows(); renderDetail(); }

pickDefault();
render();

$('#roles').addEventListener('click', e => {
  const b = e.target.closest('[data-role]'); if (!b) return;
  Object.assign(state, { role:b.dataset.role, q:'', status:'all', type:'全部類型', who:'全部責任方', phase:'all' });
  $('#q').value = '';
  pickDefault(); render();
});
$('#phases').addEventListener('click', e => {
  const b = e.target.closest('[data-phase]'); if (!b) return;
  state.phase = state.phase === b.dataset.phase ? 'all' : b.dataset.phase;
  renderList();
});
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-status]'); if (!b) return;
  state.status = state.status === b.dataset.status ? 'all' : b.dataset.status;
  renderList();
});
$('#rows').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  state.selectedId = b.dataset.id; renderRows(); renderDetail();
});
$('#q').addEventListener('input', e => { state.q = e.target.value; renderSelects(); renderRows(); });
$('#who').addEventListener('change', e => { state.who = e.target.value; renderList(); });
$('#type').addEventListener('change', e => { state.type = e.target.value; renderList(); });
$('#reset').addEventListener('click', () => {
  Object.assign(state, { q:'', status:'all', type:'全部類型', who:'全部責任方', phase:'all' });
  $('#q').value = ''; renderList();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const ids = [...document.querySelectorAll('[data-id]')].map(n => n.dataset.id);
  const i = ids.indexOf(state.selectedId);
  if (i < 0) return;
  e.preventDefault();
  state.selectedId = ids[Math.min(ids.length-1, Math.max(0, i + (e.key==='ArrowDown'?1:-1)))];
  renderRows(); renderDetail();
});
</script>
</body>
</html>
