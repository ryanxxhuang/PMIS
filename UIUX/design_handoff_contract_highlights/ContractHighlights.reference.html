<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>契約重點 · Contract Highlights（設計參考）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
  :root{

    --ok:#146c2e; --ok-text:#0f5223; --ok-tint:#e6f4ea;
    --warn:#a05a00; --warn-text:#8a4b00; --warn-tint:#fef7e0;
    --danger:#b3261e; --danger-text:#8c1d18; --danger-tint:#fceeec;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);
    font-family:"Google Sans Text","Noto Sans TC",system-ui,sans-serif;font-size:13px;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:28px 24px 56px}
  h1{margin:0;font-size:26px;font-weight:400;letter-spacing:-.005em}
  .sub{margin:6px 0 0;font-size:13px;line-height:1.7;color:var(--n700);max-width:680px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-700);text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::selection{background:var(--accent-100)}
  .msy{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;
    letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  .msy-f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:100px;font-family:inherit;
    font-weight:500;cursor:pointer;border:1px solid transparent}
  .btn-primary{height:36px;padding:0 16px;font-size:12.5px;background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-700)}
  .btn-primary:active{background:var(--accent-800)}
  .btn-sec{height:36px;padding:0 14px;font-size:12.5px;background:#fff;border-color:var(--divider);color:#3c4043}
  .btn-sec:hover{background:var(--n200)}
  .btn-out{height:36px;padding:0 16px;font-size:12.5px;background:#fff;border-color:var(--divider);color:var(--accent)}
  .btn-out:hover{background:var(--accent-100)}
  .btn-danger{height:36px;padding:0 14px;font-size:12.5px;background:transparent;color:var(--danger-text)}
  .btn-danger:hover{background:var(--danger-tint)}
  .chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:100px;
    border:1px solid var(--divider);background:#fff;color:#3c4043;font-family:inherit;font-size:12px;
    font-weight:500;cursor:pointer}
  .chip:hover{background:var(--ground)}
  .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-100);color:var(--accent-800)}
  .chip .n{opacity:.7}
  .pill{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 8px;
    border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap}
  .sel{height:30px;padding:0 8px;border:1px solid var(--divider);border-radius:8px;background:#fff;
    font-family:inherit;font-size:12px;color:#3c4043;cursor:pointer}
  .search{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border:1px solid var(--divider);
    border-radius:100px;background:#fff}
  .search:focus-within{border-color:var(--accent)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;
    font-size:13px;color:var(--text)}
  .head{padding:13px 18px;border-bottom:1px solid var(--divider);display:flex;align-items:baseline;
    justify-content:space-between;gap:16px}
  .head h2{margin:0;font-size:15px;font-weight:500}
  .row{display:grid;grid-template-columns:76px minmax(0,1fr) 150px;gap:14px;align-items:start;
    padding:12px 18px 12px 15px;border-bottom:1px solid var(--line);border-left:3px solid transparent;
    background:#fff;cursor:pointer;text-align:left;width:100%;font-family:inherit;border-top:0;border-right:0}
  .row:hover{background:var(--ground)}
  .row[aria-current="true"]{background:var(--accent-100);border-left-color:var(--accent)}
  .row .t{font-size:13px;font-weight:500;line-height:1.5;text-wrap:pretty}
  .row .m{margin-top:3px;font-size:11.5px;color:var(--n700);line-height:1.6}
  .row .r{text-align:right;font-size:11.5px;color:var(--n700);line-height:1.6}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:24px;align-items:start}
  aside{position:sticky;top:24px}
  @media (max-width:1023px){ .grid{grid-template-columns:minmax(0,1fr)} aside{position:static} }
  @media (max-width:767px){
    .row{grid-template-columns:minmax(0,1fr);gap:6px}
    .row .r{text-align:left}
    .btn-primary,.btn-sec,.btn-out,.btn-danger{height:44px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:20px">
    <div>
      <h1>契約重點</h1>
      <p class="sub">AI 已讀完契約與規範，把裡面要遵守的條文都整理在這裡。用上方搜尋找條文，右側看原文出處。</p>
    </div>
    <button type="button" class="btn btn-out" style="flex:none"><span class="msy" style="font-size:18px">add</span>手動新增</button>
  </div>

  <div class="card" style="display:flex;align-items:center;gap:28px;padding:13px 18px;margin-bottom:24px;flex-wrap:wrap">
    <span style="font-size:13px;font-weight:500">期限追蹤</span>
    <div id="due" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"></div>
    <a href="#" style="margin-left:auto;font-size:12.5px">開啟期限追蹤</a>
  </div>

  <div class="grid">
    <section class="card" style="min-width:0">
      <div class="head">
        <h2>契約重點清單</h2>
        <span class="num" style="font-size:11px;color:var(--n700)">共 <span id="total"></span> 條 · 來源 4 份文件 · 最近整理 2026-08-20</span>
      </div>

      <div style="padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px">
        <label class="search">
          <span class="msy" style="font-size:20px;color:var(--n700)">search</span>
          <input id="q" type="search" placeholder="搜尋條文、關鍵字、條款編號或頁碼…" aria-label="搜尋契約重點">
        </label>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
          <span style="width:1px;height:20px;background:var(--line);margin:0 2px"></span>
          <select id="type" class="sel" aria-label="類型"></select>
          <select id="phase" class="sel" aria-label="階段"></select>
        </div>
      </div>

      <div id="rows" role="list"></div>

      <div style="padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px">
        <span class="num" style="font-size:11.5px;color:var(--n700)">顯示 <span id="shown"></span> / <span id="total2"></span> 條</span>
        <a href="#" style="font-size:11.5px">載入更多</a>
      </div>
    </section>

    <aside class="card" id="detail" aria-live="polite"></aside>
  </div>
</div>

  {id:'r14',status:'rejected',type:'其他',phase:'施工中',who:'機關',verified:false,
   title:'契約變更累計逾原契約金額 10% 須報上級機關核准',rule:'累計 10%',
   desc:'AI 依第 16.1 條擷取；經審查認定屬機關內部作業程序，非廠商履約義務，故予駁回。',
   clause:'契約條款 16.1',page:'第 38 頁',doc:'工程契約書（v1）',
   quote:'契約變更累計金額逾原契約價金總額百分之十者，應報請上級機關核准後辦理。',
   criteria:'—',evidence:'—',
   reviewedBy:'大方工程顧問 陳志明 駁回 · 2026-08-19 16:02（機關內部程序）',
   links:[{icon:'edit_document',text:'變更設計 CO-003（審核中）'}]},
];

const state = { q:'', status:'all', type:'全部類型', phase:'全部階段', selectedId:'r1' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);

const uniq = k => ['全部' + (k === 'type' ? '類型' : '階段'), ...new Set(DATA.map(r => r[k]))];
const matches = r => {
  if (state.status !== 'all' && r.status !== state.status) return false;
  if (state.type !== '全部類型' && r.type !== state.type) return false;
  if (state.phase !== '全部階段' && r.phase !== state.phase) return false;
  const n = state.q.trim().toLowerCase();
  if (!n) return true;
  return [r.title, r.desc, r.clause, r.page, r.quote, r.type, r.phase, r.who].join(' ').toLowerCase().includes(n);
};

function renderDue(){
  $('#due').innerHTML = DUE.map(d => `
    <span style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--n700)">
      <span style="width:8px;height:8px;border-radius:100px;background:${d.dot}"></span>
      ${esc(d.label)}<span class="num" style="font-weight:500;color:var(--text)">${d.n}</span> 項
    </span>`).join('');
}

function renderChips(){
  const c = s => DATA.filter(r => r.status === s).length;
  const defs = [['all','全部',DATA.length],['pending','待核定',c('pending')],['approved','已生效',c('approved')],['rejected','已駁回',c('rejected')]];
  $('#chips').innerHTML = defs.map(([k,label,n]) =>
    `<button type="button" class="chip" data-status="${k}" aria-pressed="${state.status===k}">${label}<span class="n num">${n}</span></button>`).join('');
}

function renderSelects(){
  const fill = (el, opts, val) => { el.innerHTML = opts.map(o => `<option${o===val?' selected':''}>${esc(o)}</option>`).join(''); };
  fill($('#type'), uniq('type'), state.type);
  fill($('#phase'), uniq('phase'), state.phase);
}

function renderRows(){
  const rows = DATA.filter(matches);
  $('#shown').textContent = rows.length;
  $('#rows').innerHTML = rows.length ? rows.map(r => {
    const p = PILL[r.status];
    return `<button type="button" class="row" role="listitem" data-id="${r.id}" aria-current="${r.id===state.selectedId}">
      <span class="pill" style="background:${p.bg};color:${p.fg}">${p.label}</span>
      <span style="min-width:0">
        <span class="t" style="display:block">${esc(r.title)}</span>
        <span class="m num" style="display:block">${esc(`${r.clause} · ${r.page} · ${r.type} · ${r.who} · ${r.phase}`)}</span>
      </span>
      <span class="r num">${esc(r.rule)}</span>
    </button>`;
  }).join('') : `<div style="padding:44px 18px;text-align:center;color:var(--n700);font-size:12.5px;line-height:1.8">
      找不到符合「${esc(state.q)}」的條文。<br>試試條款編號（例 5.3）、頁碼或關鍵字（例 保固、罰則）。</div>`;
}

function renderDetail(){
  const r = DATA.find(x => x.id === state.selectedId) || DATA[0];
  const p = PILL[r.status];
  const meta = [['責任方',r.who],['階段',r.phase],['時點',r.rule],['允收標準',r.criteria],['應留存',r.evidence]];
  const vBg = r.verified ? 'var(--ok-tint)' : 'var(--warn-tint)';
  const vFg = r.verified ? 'var(--ok-text)' : 'var(--warn-text)';
  $('#detail').innerHTML = `
    <div style="padding:13px 16px;border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:10px">
      <span class="pill" style="background:${p.bg};color:${p.fg}">${p.label}</span>
      <span style="font-size:11.5px;color:var(--n700)">${esc(r.type)}</span>
      <a href="#" style="margin-left:auto;font-size:11.5px">開啟原文</a>
    </div>
    <div style="padding:16px">
      <div style="font-size:15px;font-weight:500;line-height:1.5;text-wrap:pretty">${esc(r.title)}</div>
      <p style="margin:8px 0 0;font-size:12.5px;line-height:1.8;color:#3c4043">${esc(r.desc)}</p>
      <div style="margin-top:14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:7px 12px;font-size:12px;line-height:1.6">
        ${meta.map(([k,v]) => `<span style="color:var(--n700)">${esc(k)}</span><span class="num">${esc(v)}</span>`).join('')}
      </div>
    </div>
    <div style="padding:0 16px 16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="msy" style="font-size:15px;color:var(--n700)">description</span>
        <span style="font-size:12.5px;font-weight:500">原文出處</span>
        <span class="pill" style="height:20px;padding:0 7px;font-size:10.5px;background:${vBg};color:${vFg}">${r.verified?'來源已核對':'來源待核對'}</span>
      </div>
      <div style="background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:11px 12px">
        <div class="num" style="font-size:11px;color:var(--n700);line-height:1.6">${esc(`${r.doc} · ${r.clause} · ${r.page}`)}</div>
        <p style="margin:7px 0 0;font-size:12px;line-height:1.85">「${esc(r.quote)}」</p>
      </div>
    </div>
    <div style="padding:0 16px 16px">
      <div style="font-size:12.5px;font-weight:500;margin-bottom:8px">關聯</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${r.links.map(l => `<a href="#" style="display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:8px">
          <span class="msy" style="font-size:15px;color:var(--n700)">${l.icon}</span>
          <span style="flex:1;min-width:0;font-size:12px;color:#3c4043">${esc(l.text)}</span>
          <span class="msy" style="font-size:16px;color:var(--n600)">chevron_right</span></a>`).join('')}
      </div>
    </div>
    ${r.status === 'pending' ? `
      <div style="padding:12px 16px;border-top:1px solid var(--divider);display:flex;align-items:center;gap:8px">
        <button type="button" class="btn btn-primary"><span class="msy msy-f" style="font-size:17px">check_circle</span>核定生效</button>
        <button type="button" class="btn btn-sec">修正內容</button>
        <button type="button" class="btn btn-danger">駁回</button>
      </div>` : `
      <div style="padding:12px 16px;border-top:1px solid var(--divider);display:flex;align-items:center;gap:10px">
        <span class="num" style="flex:1;min-width:0;font-size:11.5px;color:var(--n700);line-height:1.6">${esc(r.reviewedBy||'')}</span>
        <button type="button" class="btn btn-sec" style="height:32px;font-size:12px;padding:0 13px">廢止取代</button>
      </div>`}`;
}

function render(){ renderChips(); renderRows(); renderDetail(); }

$('#total').textContent = $('#total2').textContent = DATA.length;
renderDue(); renderSelects(); render();

$('#q').addEventListener('input', e => { state.q = e.target.value; renderRows(); });
$('#type').addEventListener('change', e => { state.type = e.target.value; renderRows(); });
$('#phase').addEventListener('change', e => { state.phase = e.target.value; renderRows(); });
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-status]'); if (!b) return;
  state.status = b.dataset.status; render();
});
$('#rows').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  state.selectedId = b.dataset.id; renderRows(); renderDetail();
});
</script>
</body>
</html>
